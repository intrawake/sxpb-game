[project]
name = "sxpb-game"
version = "0.1.0"
description = "A collection of games for LLM evaluation and play, utilizing the SxPB format."
authors = [
    {name = "paprika-bot", email = "sockpaprika-git@intrawake.com"},
]
license = {text = "0BSD"}
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "sxpb @ git+https://github.com/sxproto/sxpb-py@02bf7b5d5ab5be6e9756e6c0ec3d463fca2c62dd",
    "rendezqueue @ git+https://github.com/rendezqueue/rendezqueue-py.git@78b8f7e6669a19bbb98650b41853607f9b04f251",
    "sxpb-llm @ git+https://github.com/intrawake/sxpb-llm.git@070d6589f029dde9b3081fc512cb93dca9f3d001",
]
requires-python = ">=3.10"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]

[tool.ty.environment]
root = ["src", "test", "."]

[tool.pdm.scripts]
check-format = "ruff check"
check-type = "ty check"
lint-sxpb = "sxpb-lint --ignore-file .gitignore"
tidy-python = "ruff format"
tidy-sxpb = "sxpb-tidy --ignore-file .gitignore"
tidy = {composite = ["tidy-python", "tidy-sxpb"]}
lint = {composite = ["check-format", "check-type", "lint-sxpb"]}
tidytest = {composite = ["tidy", "lint", "test"]}
test = "pytest -q"
server = "python -m sxpb_game.harness.sxpb_game_main --model_by_name preset/model_by_name.sxpb"
client = "python -m sxpb_game.harness.client"
recalculate-elo = "python -m sxpb_game.tool.recalculate_elo"
benchmark-position = "python benchmark/position/eval.py --model_by_name preset/model_by_name.sxpb"

[tool.pdm.scripts.fetch-wordle-words]
shell = "mkdir -p ~/.local/share/wordle && curl -sSL -o ~/.local/share/wordle/words.txt https://gist.githubusercontent.com/dracos/dd0668f281e685bad51479e5acaadb93/raw/6bfa15d263d6d5b63840a8e5b64e04b382fdb079/valid-wordle-words.txt"
help = "Fetch the Wordle word list to ~/.local/share/wordle/words.txt"
